name: MANTA CI Python

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  repo-sanity:
    name: Repo sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Legacy naming guard
        run: python tools/check_legacy_naming.py

      - name: Python syntax checks
        run: |
          python -m py_compile \
            backend-adapter/app/main.py \
            backend-adapter/app/models.py \
            backend-adapter/app/storage.py \
            backend-adapter/app/remote_modeling.py \
            ml-pipeline/src/ml_pipeline/train_remote_backend_model.py \
            tools/check_legacy_naming.py

  backend-tests:
    name: Backend adapter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend-adapter
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run backend tests
        run: |
          cd backend-adapter
          pytest -q tests

  ml-tests:
    name: MANTA ML pipeline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: |
          cd ml-pipeline
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run ML tests
        run: |
          cd ml-pipeline
          pytest -q tests

  website:
    name: Website release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install exact website dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build release website
        run: npm run build
