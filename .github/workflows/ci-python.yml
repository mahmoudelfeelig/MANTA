name: CI Python

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:

jobs:
  backend-tests:
    name: Backend adapter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend-adapter
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run backend tests
        run: |
          cd backend-adapter
          pytest -q tests

  ml-tests:
    name: ML pipeline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: |
          cd ml-pipeline
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run ML tests
        run: |
          cd ml-pipeline
          pytest -q tests
