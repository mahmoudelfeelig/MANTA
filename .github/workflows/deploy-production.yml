name: Deploy MANTA Production

on:
  workflow_run:
    # Android is the slower gate. Trigger once from it; the release gateway
    # still requires both Android and Python CI to succeed for this exact SHA.
    workflows: ["MANTA CI Android"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: mahmoudelfeelig/HetznerReleaseGateway/.github/workflows/release.yml@f6319b2dbaf4c1f10230c6425967f34553acd61d
    with:
      app: manta
      source_sha: ${{ github.event.workflow_run.head_sha }}
      ci_run_id: ${{ github.event.workflow_run.id }}
