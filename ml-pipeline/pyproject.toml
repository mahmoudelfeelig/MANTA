[project]
name = "feel-ml-pipeline"
version = "0.1.0"
description = "Feature engineering, anomaly training, and evaluation for Android flow metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.1",
  "pandas==2.2.3",
  "scikit-learn==1.6.0",
  "joblib==1.4.2",
]

[project.optional-dependencies]
tflite = [
  "tensorflow-cpu==2.18.0"
]
test = [
  "pytest==8.3.4"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
